combo_def_18: 18
combo_def_19: 19
combo_def_20: 20
group: Global Settings


[Crosstalk Matrix Path]
tooltip: Crosstalk matrix (2D numpy array) must be a square matrix (N x N) with N being the number of Qubits and Channels. The element (i, j) must specify the value for Phi0 for qubit j subject to flux on channel i. The units of Phi0 are in [V].
datatype: PATH
def_value: ...
group: Crosstalk


